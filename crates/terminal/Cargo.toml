[package]
name = "so1-terminal"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "so1term"
path = "src/main.rs"

[dependencies]
winit = "0.30"
wgpu = "30"
pollster = "0.4"
glyphon = "0.12"
cosmic-text = "0.19"
bytemuck = { version = "1", features = ["derive"] }
portable-pty = "0.9"
libc = "0.2"
alacritty_terminal = "0.26"
vte = "0.15"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
