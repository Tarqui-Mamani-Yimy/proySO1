[package]
name = "so1sh"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Interactive shell built on the epsh POSIX engine"
publish = false

[dependencies]
epsh = { path = "../epsh" }
libc = "0.2"
nu-ansi-term = "0.50.3"
reedline = "0.52.1"

[dev-dependencies]
rexpect = "0.7.1"
strip-ansi-escapes = "0.2"
tempfile = "3"
