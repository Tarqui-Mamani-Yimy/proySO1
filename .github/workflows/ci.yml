# Lint, test and package-smoke every push to main and every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - name: Install the pinned toolchain
        run: rustup toolchain install && rustup component add rustfmt clippy
      - name: make ci
        run: make ci
      - name: Package and install smoke test
        run: sh scripts/test-install.sh
